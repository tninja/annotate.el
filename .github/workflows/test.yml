name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version:
          - 27.2
          - 28.2
          - 29.4
          - 30.1
        experimental: [false]
        include:
        - os: ubuntu-latest
          emacs-version: snapshot
          experimental: true
        - os: macos-latest
          emacs-version: snapshot
          experimental: true
        - os: windows-latest
          emacs-version: snapshot
          experimental: true
        exclude:
          - os: macos-latest
            emacs-version: 27.2

    steps:
    - uses: actions/checkout@v4

    - uses: jcs090218/setup-emacs@master
      with:
        version: ${{ matrix.emacs-version }}

    - uses: emacs-eask/setup-eask@master
      with:
        version: 'snapshot'

    # Current package-build requires Emacs 29.1.  Keep checking the
    # package's Emacs 27/28 compatibility without that build dependency.
    - name: Compile on older Emacs
      if: matrix.emacs-version == '27.2' || matrix.emacs-version == '28.2'
      run: |
        emacs --batch -Q -L . --eval "(progn
          (require 'subr-x)
          (setq byte-compile-error-on-warn t))" \
          -f batch-byte-compile annotate.el annotate-magit.el

    - name: Build and compile package
      if: matrix.emacs-version != '27.2' && matrix.emacs-version != '28.2'
      run: |
        eask package
        eask install
        eask compile
